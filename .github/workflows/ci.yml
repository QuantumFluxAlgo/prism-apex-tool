name: CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Enable corepack + pin pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Hard guard: NEVER allow order placement APIs into the codebase.
      # Scan only code files to avoid false positives in docs and binary blobs.
      - name: Guard (no order APIs)
        run: |
          set -e
          echo "Scanning for forbidden broker order APIs..."
          ! grep -REn --include=\*.{ts,tsx,js,jsx,py,go,sh,json,yml,yaml} \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
            --exclude=.github --exclude=**/docs/** \
            '(placeOrder|startOrderStrategy|liquidatePosition)' -- . \
          || (echo "::error::Order API usage detected. This project is tickets-only."; exit 1)

      # Non-blocking quality gates to surface issues without failing PRs yet
      - name: Lint (non-blocking)
        run: pnpm -r lint || true

      - name: Typecheck (non-blocking)
        run: pnpm -r typecheck || true

      - name: Tests (non-blocking)
        run: pnpm -r test || true

      - name: Typecheck (API)
        run: pnpm run typecheck:api || true

      - name: Tests (API)
        run: pnpm run test:api || true

      - name: Upload workspace diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-artifacts
          path: |
            pnpm-lock.yaml
            **/jest*.log
            **/vitest*.log
            **/coverage/**
            **/dist/**
            **/*.tsbuildinfo

      - name: Build (API)
        run: pnpm run build:api || true

  realtime-check:
    needs: qa
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker (Compose V2)
        uses: docker/setup-buildx-action@v3

      - name: Launch realtime stack (governed)
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm install --frozen-lockfile
          docker compose -f docker-compose.yml \
            -f compose.ingress-db.override.yml \
            -f compose.gapfill-realtime.override.yml \
            -f compose.tickets-realtime.override.yml \
            -f compose.codex-governor.override.yml \
            -f compose.codex-forcecurl.override.yml \
            up -d gapfill-realtime tickets-realtime db api

      - name: Wait for API health
        run: |
          set -euxo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health >/dev/null; then exit 0; fi
            sleep 5
          done
          echo "::error::API never became healthy" && exit 1

      - name: Run codex realtime check
        run: tools/codex/check-realtime.sh

      - name: Tear down realtime stack
        if: always()
        run: |
          docker compose -f docker-compose.yml \
            -f compose.ingress-db.override.yml \
            -f compose.gapfill-realtime.override.yml \
            -f compose.tickets-realtime.override.yml \
            -f compose.codex-governor.override.yml \
            -f compose.codex-forcecurl.override.yml \
            down -v
      - name: Launch realtime stack (governed)
        run: |
          set -euxo pipefail
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm install --frozen-lockfile
          docker compose -f docker-compose.yml \
            -f compose.ingress-db.override.yml \
            -f compose.gapfill-realtime.override.yml \
            -f compose.tickets-realtime.override.yml \
            -f compose.codex-governor.override.yml \
            -f compose.codex-forcecurl.override.yml \
            up -d gapfill-realtime tickets-realtime db api

      - name: Wait for API health
        run: |
          set -euxo pipefail
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/health >/dev/null; then exit 0; fi
            sleep 5
          done
          echo "::error::API never became healthy" && exit 1

      - name: Run codex realtime check
        run: tools/codex/check-realtime.sh

      - name: Tear down realtime stack
        if: always()
        run: |
          docker compose -f docker-compose.yml \
            -f compose.ingress-db.override.yml \
            -f compose.gapfill-realtime.override.yml \
            -f compose.tickets-realtime.override.yml \
            -f compose.codex-governor.override.yml \
            -f compose.codex-forcecurl.override.yml \
            down -v
