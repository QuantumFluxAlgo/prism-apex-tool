name: split-validate-tickets
on:
  workflow_dispatch:
    inputs:
      D: { description: Date YYYY-MM-DD, required: true }
      S: { description: Strategy code, required: true }
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      D: ${{ inputs.D }}
      S: ${{ inputs.S }}
      B: ${{ secrets.TICKETS_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh jq
      - name: Ensure scripts are executable
        run: |
          if compgen -G "bin/*.zsh" > /dev/null; then chmod +x bin/*.zsh; fi
      - name: Split and validate (fallback if no API)
        run: |
          set -euo pipefail
          F="tickets_${D}_${S}.jsonl"
          if [[ ! -s "$F" ]] && [[ -n "${B:-}" ]] && [[ "$B" =~ ^https?:// ]]; then
            curl -fsS "$B/tickets?date=$D&strategy=$S" | jq -c '.[]' > "$F"
          fi
          if [[ -s "$F" ]]; then
            D="$D" S="$S" zsh ./bin/split_tickets.zsh
            D="$D" S="$S" zsh ./bin/validate_split.zsh
          else
            touch "tickets_${D}_${S}.fut.jsonl" "tickets_${D}_${S}.eq.jsonl" "tickets_${D}_${S}.fut.csv" "tickets_${D}_${S}.eq.csv"
          fi
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tickets_${{ inputs.D }}_${{ inputs.S }}
          path: |
            tickets_${{ inputs.D }}_${{ inputs.S }}.fut.jsonl
            tickets_${{ inputs.D }}_${{ inputs.S }}.fut.csv
            tickets_${{ inputs.D }}_${{ inputs.S }}.eq.jsonl
            tickets_${{ inputs.D }}_${{ inputs.S }}.eq.csv
