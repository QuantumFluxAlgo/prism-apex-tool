services:
  postgres:
    image: postgres:16
    container_name: prismapex-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prismapex}
      POSTGRES_USER: ${POSTGRES_USER:-prismapex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prismapex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - prismapex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prismapex} -d ${POSTGRES_DB:-prismapex}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: prismapex-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${API_NODE_ENV:-production}
      PORT: "3000"
      DATABASE_URL: "${DATABASE_URL:-postgres://prismapex:${POSTGRES_PASSWORD:-prismapex}@postgres:5432/prismapex}"
      INGEST_YAHOO_SYMBOLS: "${INGEST_YAHOO_SYMBOLS:-}"
      YAHOO_POLL_INTERVAL_MS: "${YAHOO_POLL_INTERVAL_MS:-45000}"
      YAHOO_POLL_LOOKBACK_MINUTES: "${YAHOO_POLL_LOOKBACK_MINUTES:-20}"
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "const http=require('http');const paths=['/health','/'];const tryNext=()=>{if(!paths.length)return process.exit(1);const path=paths.shift();http.get({host:'127.0.0.1',port:3000,path},res=>{if(res.statusCode===200)process.exit(0);tryNext();}).on('error',tryNext);};tryNext();setTimeout(()=>process.exit(1),5000);"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: prismapex-dashboard
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: ${DASHBOARD_NODE_ENV:-production}
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:3000}
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    restart: unless-stopped

  ingress-yahoo:
    build:
      context: .
      dockerfile: apps/ingress-yahoo-dev/Dockerfile
    container_name: prismapex-ingress-yahoo
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env.ingress
    environment:
      NODE_ENV: ${INGRESS_NODE_ENV:-production}
    volumes:
      - ./tickets:/app/tickets
      - ./.cache:/app/.cache
      - ./config:/app/config:ro
    ports:
      - "${INGRESS_PORT:-8180}:8080"
    command: ["pnpm","-C","apps/ingress-yahoo-dev","start"]
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  prismapex_pgdata:
