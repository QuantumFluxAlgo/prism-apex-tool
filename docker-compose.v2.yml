services:
  postgres:
    image: postgres:16
    container_name: prismapex-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prismapex}
      POSTGRES_USER: ${POSTGRES_USER:-prismapex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prismapex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - prismapex_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prismapex} -d ${POSTGRES_DB:-prismapex}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: prismapex-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${API_NODE_ENV:-production}
      PORT: "3000"
      DATABASE_URL: "${DATABASE_URL:-postgres://prismapex:${POSTGRES_PASSWORD:-prismapex}@postgres:5432/prismapex}"
      SESSION_WINDOWS_UTC: "${SESSION_WINDOWS_UTC:-07:00-11:30,13:30-17:00}"
      INGEST_YAHOO_SYMBOLS: "${INGEST_YAHOO_SYMBOLS:-ES=F,NQ=F,MES=F,MNQ=F,YM=F,RTY=F,GC=F,CL=F,6E=F,EURUSD=X,BTC-USD}"
      YAHOO_POLL_INTERVAL_MS: "${YAHOO_POLL_INTERVAL_MS:-45000}"
      YAHOO_POLL_LOOKBACK_MINUTES: "${YAHOO_POLL_LOOKBACK_MINUTES:-20}"
      YAHOO_GREEN_LAG_SECONDS: "${YAHOO_GREEN_LAG_SECONDS:-900}"
      YAHOO_AMBER_LAG_SECONDS: "${YAHOO_AMBER_LAG_SECONDS:-1500}"
      SESSION_METRICS_JOB_INTERVAL_MS: "${SESSION_METRICS_JOB_INTERVAL_MS:-300000}"
      STRATEGIES_JOB_INTERVAL_MS: "${STRATEGIES_JOB_INTERVAL_MS:-600000}"
      TICKETIZER_JOB_INTERVAL_MS: "${TICKETIZER_JOB_INTERVAL_MS:-600000}"
      JOB_HEALTH_WINDOW_MS: "${JOB_HEALTH_WINDOW_MS:-900000}"
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "const http=require('http');const paths=['/health','/'];const tryNext=()=>{if(!paths.length)return process.exit(1);const path=paths.shift();http.get({host:'127.0.0.1',port:3000,path},res=>{if(res.statusCode===200)process.exit(0);tryNext();}).on('error',tryNext);};tryNext();setTimeout(()=>process.exit(1),5000);"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: prismapex-dashboard
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: ${DASHBOARD_NODE_ENV:-production}
      VITE_API_BASE: ${VITE_API_BASE:-http://localhost:3000}
    ports:
      - "${DASHBOARD_PORT:-8080}:80"
    restart: unless-stopped

  ingress-yahoo:
    build:
      context: .
      dockerfile: apps/ingress-yahoo-dev/Dockerfile
    container_name: prismapex-ingress-yahoo
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env.ingress
    environment:
      NODE_ENV: ${INGRESS_NODE_ENV:-production}
    volumes:
      - ./tickets:/app/tickets
      - ./.cache:/app/.cache
      - ./config:/app/config:ro
    ports:
      - "${INGRESS_PORT:-8180}:8080"
    command: ["pnpm","-C","apps/ingress-yahoo-dev","start"]
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db-maint:
    image: alpine:3.20
    container_name: prismapex-db-maint
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://prismapex:${POSTGRES_PASSWORD:-prismapex}@postgres:5432/prismapex}"
      TZ: "${TZ:-UTC}"
    volumes:
      - ./deploy/db:/maintenance:ro
    entrypoint:
      - /bin/sh
      - -lc
      - |
          set -e
          apk add --no-cache postgresql-client tzdata >/dev/null
          crontab - <<'CRON'
          0 2 * * * psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /maintenance/maintenance.sql >> /var/log/cron.log 2>&1
          CRON
          touch /var/log/cron.log
          echo "[db-maint] cron started (nightly VACUUM ANALYZE @ 02:00 UTC)"
          crond -f -l 8
    restart: unless-stopped

  gapfill-cron:
    image: alpine:3.20
    container_name: prismapex-gapfill-cron
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: "${TZ:-UTC}"
      DATABASE_URL: "${DATABASE_URL:-postgres://prismapex:${POSTGRES_PASSWORD:-prismapex}@postgres:5432/prismapex}"
      YAHOO_SYMBOLS: "${INGEST_YAHOO_SYMBOLS:-ES=F,NQ=F,MES=F,MNQ=F,YM=F,RTY=F,GC=F,CL=F,6E=F,EURUSD=X,BTC-USD}"
      YAHOO_INTERVAL: "${YAHOO_INTERVAL:-1m}"
    volumes:
      - ./:/repo:ro
    entrypoint:
      - /bin/sh
      - -lc
      - |
          set -e
          apk add --no-cache nodejs-current npm >/dev/null
          corepack enable >/dev/null 2>&1 || true
          crontab - <<'CRON'
          20 2 * * * node /repo/apps/ingest/dist/gapfill.js >> /var/log/gapfill-cron.log 2>&1
          CRON
          touch /var/log/gapfill-cron.log
          echo "[gapfill-cron] scheduled daily gapfill @ 02:20 UTC"
          crond -f -l 8
    restart: unless-stopped

  tickets-cron:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: prismapex-tickets-cron
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgres://prismapex:${POSTGRES_PASSWORD:-prismapex}@postgres:5432/prismapex}"
      YAHOO_SYMBOLS: "${INGEST_YAHOO_SYMBOLS:-ES=F,NQ=F,MES=F,MNQ=F,YM=F,RTY=F,GC=F,CL=F,6E=F,EURUSD=X,BTC-USD}"
      ORR_OR_MIN: "${ORR_OR_MIN:-5}"
      ORR_WINDOW_MIN: "${ORR_WINDOW_MIN:-60}"
      SESSION_OPEN_UTC: "${SESSION_OPEN_UTC:-23:05}"
      SESSION_CLOSE_UTC: "${SESSION_CLOSE_UTC:-21:55}"
    working_dir: /app
    entrypoint:
      - /bin/sh
      - -lc
      - |
          set -e
          while true; do
            echo "[tickets-cron] running ORR backfill"
            node apps/tickets/dist/backfill-orr.js || true
            sleep 60
          done
    restart: unless-stopped

  jobs-seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: prismapex-jobs-seed
    profiles: ["jobs"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: "${DATABASE_URL:-postgres://prismapex:${POSTGRES_PASSWORD:-prismapex}@postgres:5432/prismapex}"
      YAHOO_SYMBOLS: "${INGEST_YAHOO_SYMBOLS:-ES=F,NQ=F,MES=F,MNQ=F,YM=F,RTY=F,GC=F,CL=F,6E=F,EURUSD=X,BTC-USD}"
      YAHOO_RANGE: "${YAHOO_RANGE:-30d}"
      YAHOO_INTERVAL: "${YAHOO_INTERVAL:-1m}"
      TICKETS_DAYS: "${TICKETS_DAYS:-30}"
    entrypoint:
      - bash
      - -lc
      - |
        set -euo pipefail
        echo "[jobs-seed] Backfill Yahoo bars..."
        node apps/ingest/dist/backfill.js
        echo "[jobs-seed] Gapfill Yahoo bars..."
        node apps/ingest/dist/gapfill.js
        echo "[jobs-seed] Backfill tickets..."
        node apps/tickets/dist/backfill-orr.js
        echo "[jobs-seed] Completed."
    restart: "no"

volumes:
  prismapex_pgdata:
