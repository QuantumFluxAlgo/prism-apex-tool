version: "3.9"
services:
  gapfill-realtime:
    volumes:
      - ./tools/ingress:/opt/ingress:ro
      - ./tools/ingress/bin/curl:/usr/local/bin/curl:ro
    environment:
      - "PATH=/opt/ingress/bin:${PATH}"
      - "GOV_PATH=/opt/ingress/governor.sh"
      - "NODE_OPTIONS=--require /opt/ingress/node-hook.js"
      - "ING_METRICS_PATH=/data/ops/ingress-metrics.jsonl"
  tickets-realtime:
    volumes:
      - ./tools/ingress:/opt/ingress:ro
      - ./tools/ingress/bin/curl:/usr/local/bin/curl:ro
    environment:
      - "PATH=/opt/ingress/bin:${PATH}"
      - "GOV_PATH=/opt/ingress/governor.sh"
      - "NODE_OPTIONS=--require /opt/ingress/node-hook.js"
      - "ING_METRICS_PATH=/data/ops/ingress-metrics.jsonl"
