server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API endpoints to the api service (same Docker network)
  location /tickets    { proxy_pass http://api:3000; }
  location /health     { proxy_pass http://api:3000; }
  location /version    { proxy_pass http://api:3000; }
  location /ready      { proxy_pass http://api:3000; }
}
