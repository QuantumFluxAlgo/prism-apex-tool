server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never cache index.html (forces new bundle names)
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  # SPA routing
  location / { try_files $uri $uri/ /index.html; }

  # Proxy API to the api container
  location /tickets { proxy_pass http://api:3000; }
  location /health  { proxy_pass http://api:3000; }
  location /version { proxy_pass http://api:3000; }
  location /ready   { proxy_pass http://api:3000; }
}
