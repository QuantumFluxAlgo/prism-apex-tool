# Prism-Apex Dashboard (static SPA + API proxy)
server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Proxy API calls to the api service (container name 'api', port 3000)
  location /api/ {
    proxy_pass         http://api:3000/api/;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_redirect     off;
  }

  # Health
  location = /health { add_header Content-Type text/plain; return 200 "ok\n"; }

  # Dedicated status snapshot page
  location = /status {
    try_files /status/index.html =404;
  }

  location /status/ {
    try_files $uri $uri/ /status/index.html;
  }

  # SPA fallback
  location / { try_files $uri $uri/ /index.html; }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
