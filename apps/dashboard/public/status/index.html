<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Status • Prism Apex</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="/theme.css" />
  <script src="/statusbar.js"></script>
</head>
<body>
  <div class="container stack">
    <header class="card stack">
      <a class="btn" href="/">← Back</a>
      <div class="row row-between">
        <h1>System Status</h1>
      </div>
      <div id="error" class="error" hidden></div>
    </header>

    <main class="stack">
      <section id="services" class="grid"></section>
      <div class="card stack">
        <h2>Symbols</h2>
        <div class="symbol-grid" id="symbol-grid"></div>
      </div>
    </main>
  </div>
  <script>
    const STATUS_ENDPOINT = '/api/status';
    const COLORS = { green: '#16a34a', amber: '#f59e0b', red: '#ef4444', grey: '#64748b' };
    const SERVICES = [
      { key: 'db', label: 'Database', detail: 'Postgres connectivity + latest bar times' },
      { key: 'api', label: 'API', detail: 'Fastify process + auth middleware' },
      { key: 'yahoo', label: 'Yahoo Ingress', detail: 'Market data fetcher (ingress service)' },
      { key: 'tickets_cron', label: 'Tickets Cron', detail: 'Open ticket refresh (60s)' },
      { key: 'gapfill_cron', label: 'Gapfill Cron', detail: 'Backfills missing bars (daily)' },
    ];

    const servicesWrap = document.getElementById('services');
    const symbolsGrid = document.getElementById('symbol-grid');
    const errorEl = document.getElementById('error');

    function formatIso(iso) {
      if (!iso) return '—';
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return iso;
      return date.toISOString().replace('T', ' ').replace('Z', ' UTC');
    }

    function formatAge(ageMs) {
      if (ageMs === null || ageMs === undefined) return '—';
      const totalSeconds = Math.max(0, Math.floor(Number(ageMs) / 1000));
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;
      if (hours > 0) return `${hours}h ${String(minutes).padStart(2, '0')}m`;
      if (minutes > 0) return `${minutes}m ${String(seconds).padStart(2, '0')}s`;
      return `${seconds}s`;
    }

    function setDot(el, health) {
      if (!el) return;
      el.style.background = COLORS[health] ?? COLORS.grey;
    }

    function humanLabel(health) {
      switch (health) {
        case 'green': return 'Running';
        case 'amber':
          return 'Limited / delayed';
        case 'red': return 'Problems fetching';
        case 'grey': return 'Backoff';
        default:
          return 'Unknown';
      }
    }

    function renderServices(services) {
      servicesWrap.innerHTML = '';
      SERVICES.forEach(({ key, label, detail }) => {
        const health = services?.[key] ?? 'grey';
        const card = document.createElement('div');
        card.className = 'card';

        const header = document.createElement('div');
        header.className = 'row row-between';

        const nameWrap = document.createElement('div');
        nameWrap.className = 'row';
        const dot = document.createElement('span');
        dot.className = `dot ${health}`;
        const name = document.createElement('strong');
        name.textContent = label;
        nameWrap.append(dot, name);

        const pill = document.createElement('span');
        pill.className = 'pill sm';
        const pillDot = document.createElement('span');
        pillDot.className = `dot ${health}`;
        const pillLabel = document.createElement('span');
        pillLabel.textContent = humanLabel(health);
        pill.append(pillDot, pillLabel);

        header.append(nameWrap, pill);
        card.append(header);

        if (detail) {
          const info = document.createElement('div');
          info.className = 'muted';
          info.textContent = detail;
          card.append(info);
        }

        servicesWrap.append(card);
      });
    }

    function renderSymbols(symbols, relaxed) {
      symbolsGrid.innerHTML = '';
      (symbols ?? []).forEach((entry) => {
        const card = document.createElement('div');
        card.className = 'symbol-card';

        const header = document.createElement('div');
        header.className = 'symbol-card__header';
        const chip = document.createElement('span');
        chip.className = `pill sm symbol-chip`;
        chip.innerHTML = `<span class="dot ${entry.health ?? 'grey'}"></span><span>${humanLabel(entry.health ?? 'grey')}</span>`;
        const symbol = document.createElement('span');
        symbol.className = 'symbol-card__symbol';
        symbol.textContent = entry.symbol ?? '—';
        header.append(symbol, chip);

        const meta = document.createElement('div');
        meta.className = 'symbol-card__meta';
        const last = document.createElement('div');
        last.innerHTML = `<span class="label">Last bar</span><span class="value">${
          entry.last_utc ? formatIso(entry.last_utc) : '—'
        }</span>`;
        const age = document.createElement('div');
        age.innerHTML = `<span class="label">Age</span><span class="value">${
          entry.last_utc ? formatAge(entry.age_ms) : relaxed ? 'paused' : '—'
        }</span>`;
        meta.append(last, age);

        card.append(header, meta);
        symbolsGrid.append(card);
      });
    }

    async function load() {
      try {
        const res = await fetch(STATUS_ENDPOINT, { cache: 'no-store' });
        if (!res.ok) throw new Error(`Status ${res.status}`);
        const data = await res.json();

        errorEl.hidden = true;
        renderServices(data.services);
        renderSymbols(data.symbols, !data.session?.is_open);
      } catch (err) {
        const message = err instanceof Error ? err.message : String(err);
        errorEl.textContent = `Failed to load status: ${message}`;
        errorEl.hidden = false;
        servicesWrap.innerHTML = '';
        symbolsBody.innerHTML = '';
      }
    }

    load();
    setInterval(load, 15_000);
  </script>
</body>
</html>
