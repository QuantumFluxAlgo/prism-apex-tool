# map for websocket upgrade
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# upstreams on the same docker network
upstream dashboard { server prism-apex-tool-dashboard-full-1:80; }
upstream api       { server prism-apex-tool-api-1:3000; }

server {
  listen 80;
  server_name _;

  # ===== API FIRST (must be above the catch-all) =====
  location /api/ {
    proxy_pass http://api;
    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;

    # CORS (permissive for demo)
    add_header Access-Control-Allow-Origin  * always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    # Preflight fast-path
    if ($request_method = OPTIONS) { return 204; }
  }

  # Long-cache for versioned assets (we cache-bust via ?v=...)
  location /assets/ {
    proxy_pass http://dashboard;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Everything else → dashboard shell (short-cache so index.html updates)
  location / {
    proxy_pass http://dashboard;
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # --- shim: old UI expects /api/health; API serves /api/status ---
  location = /api/health {
    proxy_pass http://api/status;
    proxy_http_version 1.1;

    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $scheme;
    proxy_set_header Upgrade            $http_upgrade;
    proxy_set_header Connection         $connection_upgrade;

    # mirror permissive CORS used under /api/
    add_header Access-Control-Allow-Origin  * always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,PATCH,DELETE,OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    # Preflight fast-path (if any OPTIONS hit this exact path)
    if ($request_method = OPTIONS) { return 204; }
  }
}
