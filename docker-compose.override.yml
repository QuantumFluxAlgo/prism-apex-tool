services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: "production"
      HUSKY: "0"
      PORT: "3000"
      LOG_LEVEL: "info"
      TRUST_PROXY: "true"

      # Jobs default OFF (safe in all envs)
      JOBS_ENABLE_FEED: "false"

      # Set these to enable the feed job
      # TRADOVATE_BASE_URL: "https://demo-api.tradovate.com/v1"
      # TRADOVATE_CLIENT_ID: "..."
      # TRADOVATE_USERNAME: "..."
      # TRADOVATE_PASSWORD: "..."
      # TRADOVATE_APP_ID: "..."
      # TRADOVATE_APP_VERSION: "..."

    working_dir: /app
    command: ["node", "/app/apps/api/dist/index.js"]
    ports:
      - "3000:3000"
    volumes: []
    healthcheck:
      test: ["CMD", "node", "-e", "require('fs').accessSync('/app/apps/api/dist/index.js'); require.resolve('fastify'); console.log('ok')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
