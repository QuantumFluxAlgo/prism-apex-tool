services:
  dashboard-full:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    image: prism-apex/dashboard-full:local
    container_name: prism-apex-dashboard-full
    ports:
      - "5180:80"
    environment:
      PORT: "8080"
      APEX_TICKETS_DIR: "/data/tickets"
      API_BASE_URL: "http://api:3000"
    depends_on:
      - api
    volumes:
      - api-data:/data:ro
    restart: unless-stopped

  api:
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://apex:apex@db:5432/prismapex?schema=public}"
    depends_on:
      - db

volumes:
  api-data:
    external: false
