services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PGUSER:-apex}
      POSTGRES_PASSWORD: ${PGPASSWORD:-apex}
      POSTGRES_DB: ${PGDATABASE:-prismapex}
    ports: []
    volumes:
    - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${PGUSER:-apex} -d ${PGDATABASE:-prismapex}
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      target: api
    image: prism-apex/api:latest
    env_file:
    - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://apex:apex@db:5432/prismapex?schema=public}
      SESSION_WINDOWS_UTC: ${SESSION_WINDOWS_UTC:-14:30-21:00}
      SESSION_OPEN_UTC: ${SESSION_OPEN_UTC:-14:30}
      SESSION_CLOSE_UTC: ${SESSION_CLOSE_UTC:-21:00}
      TICKETS_ONLY: ${TICKETS_ONLY:-true}
      ORDERS_DISABLED: ${ORDERS_DISABLED:-true}
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    ports: []
    healthcheck:
      test:
      - CMD-SHELL
      - node -e "const http=require('http');const paths=['/health','/'];const tryNext=()=>{if(!paths.length)return
        process.exit(1);const path=paths.shift();http.get({host:'127.0.0.1',port:3000,path},res=>{if(res.statusCode===200)process.exit(0);tryNext();}).on('error',tryNext);};tryNext();setTimeout(()=>process.exit(1),5000);"
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
    - api_data:/data:ro
  dashboard-full:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_BASE: /api
    image: prism-apex/dashboard-full:local
    environment:
      API_BASE_URL: http://api:3000
      PORT: '8080'
      VITE_API_BASE: /api
    depends_on:
      api:
        condition: service_healthy
    ports: []
    volumes:
    - api_data:/data:ro
    restart: unless-stopped
  ingress:
    image: nginx:1.27-alpine
    container_name: prismapex-ingress
    ports:
    - 5180:80
    volumes:
    - ./deploy/ingress/local/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - api
    - dashboard-full
volumes:
  db_data: null
  api_data: null
