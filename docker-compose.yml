name: prism-apex-tool
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: prism-apex-tool-api:latest
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      TRUST_PROXY: "true"
      DATA_DIR: /data
      BEARER_TOKEN: ""
    ports:
      - "3000:3000"
    # IMPORTANT: do not bind-mount the repo; it would hide compiled files.
    volumes:
      - api-data:/data
    # Let the Dockerfile's CMD run: ["node","apps/api/dist/index.js"]
    working_dir: /app
volumes:
  api-data:
  pnpm-store:
  node_modules:
