version: "3.9"
services:
  api:
    build:
      context: .
      target: api
    image: prism-apex/api:latest
    env_file:
      - .env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD","node","-e","require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1))"]
      interval: 10s
      timeout: 3s
      retries: 10

  dashboard:
    build:
      context: .
      target: dashboard
    image: prism-apex/dashboard:latest
    ports:
      - "8080:80"
    depends_on:
      - api
