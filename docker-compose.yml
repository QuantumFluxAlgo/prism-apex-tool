services:
  db:
    image: postgres:16-alpine
    profiles: ["local", "prod"]
    environment:
      POSTGRES_USER: ${PGUSER:-apex}
      POSTGRES_PASSWORD: ${PGPASSWORD:-apex}
      POSTGRES_DB: ${PGDATABASE:-prismapex}
    ports:
      - "${PGHOSTPORT:-55433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-apex} -d ${PGDATABASE:-prismapex}"]
      interval: 5s
      timeout: 5s
      retries: 20

  db_maint:
    image: alpine:3.20
    profiles: ["prod"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://apex:apex@db:5432/prismapex}
      TZ: ${TZ:-UTC}
    volumes:
      - ./deploy/db:/maintenance:ro
    entrypoint:
      - /bin/sh
      - -lc
      - |
          set -e
          apk add --no-cache postgresql-client tzdata >/dev/null
          crontab - <<'CRON'
          0 2 * * * psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /maintenance/maintenance.sql >> /var/log/cron.log 2>&1
          CRON
          touch /var/log/cron.log
          echo "[db_maint] cron started (nightly VACUUM ANALYZE @ 02:00)"
          crond -f -l 8

  api:
    build:
      context: .
      target: api
    image: prism-apex/api:latest
    profiles: ["local", "prod"]
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://apex:apex@db:5432/prismapex?schema=public}
      TICKETS_ONLY: ${TICKETS_ONLY:-true}
      ORDERS_DISABLED: ${ORDERS_DISABLED:-true}
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: [
        "CMD-SHELL",
        "node -e \"const http=require('http');const paths=['/health','/'];const tryNext=()=>{if(!paths.length)return process.exit(1);const path=paths.shift();http.get({host:'127.0.0.1',port:3000,path},res=>{if(res.statusCode===200)process.exit(0);tryNext();}).on('error',tryNext);};tryNext();setTimeout(()=>process.exit(1),5000);\""
      ]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - api_data:/data:ro

  dashboard-full:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    image: prism-apex/dashboard-full:local
    profiles: ["local", "prod"]
    environment:
      API_BASE_URL: "http://api:3000"
      PORT: "8080"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5180:80"
    volumes:
      - api_data:/data:ro
    restart: unless-stopped

  dashboard-dev:
    build:
      context: .
      target: dashboard
    image: prism-apex/dashboard:dev
    profiles: ["dev"]
    environment:
      CI: "1"
    command: >
      sh -lc "corepack enable && corepack prepare pnpm@9.0.0 --activate &&
      pnpm install --no-frozen-lockfile &&
      pnpm -C apps/dashboard dev --host 0.0.0.0 --port 5180"
    ports:
      - "5179:5180"
    depends_on:
      api:
        condition: service_healthy

  ingress-yahoo:
    build:
      context: .
      dockerfile: apps/ingress-yahoo-dev/Dockerfile
    image: prism-apex:ingress-dev
    profiles: ["local", "prod"]
    env_file:
      - .env.ingress
    volumes:
      - ./tickets:/app/tickets
      - ./.cache:/app/.cache
      - ./config:/app/config:ro
    ports:
      - "8080:8080"
    restart: unless-stopped
    command: ["pnpm","-C","apps/ingress-yahoo-dev","start"]
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  ingest-once:
    build:
      context: .
      target: api
    image: prism-apex/ingest:latest
    profiles: ["jobs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://apex:apex@db:5432/prismapex}
      YAHOO_SYMBOLS: ${YAHOO_SYMBOLS:-ES=F,NQ=F,YM=F,RTY=F,GC=F,CL=F,6E=F,EURUSD=X}
      YAHOO_RANGE: ${YAHOO_RANGE:-30d}
      YAHOO_INTERVAL: ${YAHOO_INTERVAL:-1m}
    command: ["node", "apps/ingest/dist/backfill.js"]
    depends_on:
      db:
        condition: service_healthy

  gapfill-once:
    build:
      context: .
      target: api
    image: prism-apex/ingest:latest
    profiles: ["jobs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://apex:apex@db:5432/prismapex}
      YAHOO_SYMBOLS: ${YAHOO_SYMBOLS:-ES=F,NQ=F,YM=F,RTY=F,GC=F,CL=F,6E=F,EURUSD=X}
      YAHOO_INTERVAL: ${YAHOO_INTERVAL:-1m}
    command: ["node", "apps/ingest/dist/gapfill.js"]
    depends_on:
      db:
        condition: service_healthy

  tickets-once:
    build:
      context: .
      target: api
    image: prism-apex/tickets:latest
    profiles: ["jobs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://apex:apex@db:5432/prismapex}
      YAHOO_SYMBOLS: ${YAHOO_SYMBOLS:-ES=F,NQ=F,YM=F,RTY=F,GC=F,CL=F,6E=F,EURUSD=X}
      TICKETS_DAYS: ${TICKETS_DAYS:-30}
      ORR_OR_MIN: ${ORR_OR_MIN:-5}
      ORR_WINDOW_MIN: ${ORR_WINDOW_MIN:-60}
      SESSION_OPEN_UTC: ${SESSION_OPEN_UTC:-23:05}
      SESSION_CLOSE_UTC: ${SESSION_CLOSE_UTC:-21:55}
    command: ["node","apps/tickets/dist/backfill-orr.js"]
    depends_on:
      db:
        condition: service_healthy

  gapfill-cron:
    image: alpine:3.20
    profiles: ["local", "prod"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: UTC
      DATABASE_URL: ${DATABASE_URL:-postgres://apex:apex@db:5432/prismapex}
      YAHOO_SYMBOLS: ${YAHOO_SYMBOLS:-ES=F,NQ=F,GC=F,CL=F}
      YAHOO_INTERVAL: ${YAHOO_INTERVAL:-1m}
    volumes:
      - ./:/repo:ro
    entrypoint:
      - /bin/sh
      - -lc
      - |
          set -e
          apk add --no-cache nodejs-current npm >/dev/null
          corepack enable >/dev/null 2>&1 || true
          crontab - <<'CRON'
          20 2 * * * node /repo/apps/ingest/dist/gapfill.js >> /var/log/gapfill-cron.log 2>&1
          CRON
          touch /var/log/gapfill-cron.log
          echo "[gapfill-cron] scheduled daily 02:20 UTC (GMT)."
          crond -f -l 8
    restart: unless-stopped

  tickets-cron:
    image: prism-apex/api:latest
    profiles: ["local", "prod"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://apex:apex@db:5432/prismapex}
      YAHOO_SYMBOLS: ${YAHOO_SYMBOLS:-ES=F,NQ=F,YM=F,RTY=F,GC=F,CL=F,6E=F,EURUSD=X}
      ORR_OR_MIN: ${ORR_OR_MIN:-5}
      ORR_WINDOW_MIN: ${ORR_WINDOW_MIN:-60}
      SESSION_OPEN_UTC: ${SESSION_OPEN_UTC:-23:05}
      SESSION_CLOSE_UTC: ${SESSION_CLOSE_UTC:-21:55}
    entrypoint:
      - /bin/sh
      - -lc
      - |
          set -e
          while true; do
            echo "[tickets-cron] running"
            node apps/tickets/dist/backfill-orr.js || true
            sleep 60
          done
    working_dir: /app
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped

  tickets-sync:
    image: alpine:3.20
    profiles: ["dev"]
    command:
      - /bin/sh
      - -lc
      - sleep infinity

  orr-sync:
    image: prism-apex/api:latest
    profiles: ["dev"]
    restart: unless-stopped
    command:
      - /app/apps/api/scripts/run-node-script.sh
      - /app/apps/api/dist-cjs/scripts/syncTickets.js
      - --interval
      - "60"
      - --symbols
      - "ES=F,NQ=F,MES=F,MNQ=F"
    environment:
      TICKETS_FILE: /data/tickets.jsonl
      TICKETS_DIR: /data/tickets
    volumes:
      - api_data:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
  api_data:
