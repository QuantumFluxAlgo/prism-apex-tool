log_format prismapex '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream=$upstream_addr upstream_status=$upstream_status '
                    'rt=$request_time urt=$upstream_response_time';

access_log /dev/stdout prismapex;
error_log  /dev/stderr warn;

server {
  listen 80;
  server_name _;

  add_header X-PrismApex-Ingress "prismapex-5180" always;
  add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;

  location = /ui-meta {
    default_type application/json;
    return 200 '{"ingress":"prismapex-5180","api_upstream":"api:3000","dashboard_upstream":"dashboard-full:80"}';
  }

  location = /healthz { proxy_pass http://api:3000/healthz; proxy_set_header Host $host; }
  location = /health  { proxy_pass http://api:3000/health;  proxy_set_header Host $host; }

  location /api/ {
    add_header X-PrismApex-ApiProxy "1" always;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }

  location / {
    proxy_pass http://dashboard-full:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
  }
}
